[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capcan"
version = "0.1.0"
description = "Client capability and analytics platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.1.3",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "Werkzeug==3.1.6",
    "Jinja2==3.1.6",
    "click==8.3.1",
    "blinker==1.9.0",
    "pyinstaller==6.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["**/*.json", "**/*.html", "**/*.css", "**/*.js"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-v --tb=short"