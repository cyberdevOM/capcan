{% extends "base.html" %}
{% block title %} Client - Capcan {% endblock %}
{% block content %}
    <h1>Client Details</h1>
    <table>
        <tr><th>ID</th><th>Platform</th><th>Status</th></tr>
        {% for client in clients %}
        <tr>
            <td>{{ client.id }}</td>
            <td>{{ client.platform }}</td>
            <td>{{ client.status }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
